<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03-get-elements</title>
    <link rel="stylesheet" href="../src/css/04-javascript.css">
    <style>
        section {
            ul {
                padding: 0;
            }
            ul li,
            figure.animal {
                background-color: #0006;
                border-radius: 2px;
                height: 25px;
                margin: 2px auto;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 25px;
                zoom: 2.5;
            }
        }
    </style>
</head>
<body>
 <a href="../04-javascript/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="white" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg> </a>
<main>
    <header>
        <h1>03-get-elements</h1>
        <h2>
            Access and manipulate HTML elements using JavaScript.
        </h2>
    </header>
    <section>
            <h3>Get Element By Id:</h3>
            <h4 id="year"></h4>
            <h3>Get Elements By Tag Name:</h3>
            <ul>
                <li>🍎</li>
                <li>🍇</li>
                <li>🍊</li>
                <li>🍒</li>
            </ul>
            <h4></h4>
            <h3>Get Elements By Class Name</h3>
            <p class="paragraph">Lorem ipsum dolor</p>
            <p class="paragraph">Lorem ipsum dolor</p>
            <p class="paragraph">Lorem ipsum dolor</p>
            <h3>Query Selector & Query Selector All</h3>
            <figure class="animal first">🦊</figure>
            <figure class="animal">🐼</figure>
            <figure class="animal">🐷</figure>
        </section>
</main>
<script>
  // Get element by ID
  const year = document.getElementById('year');
  const ndate = new Date;
  year.textContent = `Present Year: ${ndate.getFullYear()}`;
  

  // Get element By TagName
  const fruits = document.getElementsByTagName('li')
  const h4s    = document.getElementsByTagName('h4')

  h4s[1].textContent = `There are ${fruits.length} fruits`
  h4s[1].innerHTML += `<br> Firts fruit is ${fruits[0].textContent} `
  h4s[1].innerHTML += `<br> Last fruit is ${fruits[fruits.length-1].textContent} `


  //Get Elements By ClassName 
  const ps = document.getElementsByClassName('paragraph')
  ps[1].textContent           = 'New text value'
  ps[1].style.backgroundColor = 'blue'
  ps[1].style.color           = 'white'
  ps[1].style.padding         = '0.4rem'


  //QuerySelector & QuerySelectorAll
  const first = document.querySelector('figure.first')
  first.style.backgroundColor = 'orange'

  const animals = document.querySelectorAll('figure.animal')
  // Static and Large way
  //animals[0].style.borderRadius = '50%';
  //animals[1].style.borderRadius = '50%';
  //animals[2].style.borderRadius = '50%';

  //Dinamic and Short way
  animals.forEach(element => {
    element.style.borderRadius = '50%';
  })

</script>
</body>
</html>
