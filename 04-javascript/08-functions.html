<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08-functions</title>
    <link rel="stylesheet" href="../src/css/04-javascript.css">
</head>
<style>
        form {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            strong,
            output {
                font-size: 1.6rem;
            }
            input {
                border-radius: 0.4rem;
                border: none;
                padding: 0.4rem;
                width: 100px;
            }
        }
        h4 {
            font-size: 1.4rem;
            margin-block: 1.2rem;
        }
    
</style>
<body>
 <a href="../04-javascript/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="white" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg> </a>
    <main>
    <section>
            <h3>01- Function without params/args</h3>
            <h4 class="greeting"></h4>
            <h3>02- Function with params/args</h3>
            <form>
                <input type="number" id="n1" min="1" max="999" placeholder="Number 1">
                <strong>+</strong>
                <input type="number" id="n2" min="1" max="999" placeholder="Number 2">
                <strong>=</strong>
                <output></output>
            </form>
            <h3>03- Function return value</h3>
            <h4 class="time"></h4>
            <script>
    //elements
    const greeting  = document.querySelector('.greeting');
    const n1        = document.querySelector('#n1');
    const n2        = document.querySelector('#n2');
    const output    = document.querySelector('output');
    const time      = document.querySelector('.time');

    //function
function showGreeting() {
    greeting.textContent = ' Hello javascript';
}
showGreeting();

// 02- Function with params/args
function showSum(n1 = 1, n2) {
    output.textContent = parseInt(n1)+parseInt(n2);
}

// Events
n1.addEventListener('input', () => {
    showSum(n1.value, n2.value);
})
n2.addEventListener('input', () => {
    showSum(n1.value, n2.value);
})

// 03- Function return value
function showTime() {
    const ndate = new Date();
    const meridian = ndate.getHours() >= 12 ? 'pm' : 'am';
    return `${ndate.getHours()}:${ndate.getMinutes()} ${meridian}`;
}
time.textContent = showTime();
time.style.zoom = 2;
</script>
        </section>
    </main>
</body>
</html>
